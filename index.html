<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101017">
  <meta name="description" content="oiuv 的个人主页。逛逛我的 GitHub，在游戏常春藤重温经典，或到 MUD.REN 走一趟文字江湖。">
  <title>oiuv · 噢哎呦喂的个人主页</title>
  <link rel="icon" href="./assets/companion.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/oiuv-pixel.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./style.css">
</head>
<body id="top">
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="grid" viewBox="0 0 24 24">
      <path d="M3 3h7v7H3zm11 0h7v7h-7zM3 14h7v7H3zm11 0h7v7h-7z" fill="currentColor"/>
    </symbol>
    <symbol id="pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z" fill="currentColor"/></symbol>
    <symbol id="play" viewBox="0 0 24 24"><path d="m6 3 14 9-14 9z" fill="currentColor"/></symbol>
    <symbol id="new-window" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
        <path d="M7 8H4v12h12v-3"/><rect x="9" y="4" width="11" height="11" rx="1"/>
      </g>
    </symbol>
    <symbol id="code" viewBox="0 0 24 24"><path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="bevel"/></symbol>
    <symbol id="gamepad" viewBox="0 0 24 24">
      <path d="M6 6h12l2 2 2 9-2 2h-2l-3-3H9l-3 3H4l-2-2 2-9zM5 11h6M8 8v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M15 11h2v2h-2zm3-3h2v2h-2z" fill="currentColor"/>
    </symbol>
    <symbol id="terminal" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m6 8 4 4-4 4m7 0h5"/></g></symbol>
  </svg>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#top" aria-label="oiuv 首页">
        <img src="./assets/companion.svg" width="30" height="30" alt="">
        <span>oiuv<span class="brand-dot">.</span></span>
      </a>
      <div class="topbar-actions">
        <a class="nav-link" href="#portals">站点入口</a>
        <button id="motion" class="motion" type="button" aria-label="场景动效" aria-pressed="false" hidden>
          <svg aria-hidden="true" viewBox="0 0 24 24"><use href="#play"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main class="wrap">
    <section class="hero" aria-labelledby="intro">
      <img class="skyline" src="./assets/skyline.webp" width="1920" height="640" alt="" fetchpriority="high">
      <div class="sky-effects" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="intro">
        <h1 id="intro"><span class="greeting">你好，我是</span><span class="signature">oiuv<span class="cursor" aria-hidden="true"></span></span></h1>
        <p>写代码，玩游戏，在文字里走江湖。</p>
      </div>
    </section>

    <nav id="portals" aria-labelledby="portals-title" tabindex="-1">
      <div class="section-head">
        <svg aria-hidden="true"><use href="#grid"/></svg>
        <h2 id="portals-title">站点入口</h2>
      </div>
      <p id="new-tab-hint" class="visually-hidden">在新窗口打开</p>
      <div class="cards">
        <a class="card code-card" href="https://github.com/oiuv" target="_blank" rel="noopener noreferrer" aria-labelledby="code-title" aria-describedby="code-desc new-tab-hint">
          <div class="cover"><img src="./assets/github.webp" width="848" height="339" alt=""></div>
          <div class="card-body">
            <h3 id="code-title"><svg aria-hidden="true"><use href="#code"/></svg>GitHub</h3>
            <p id="code-desc">逛逛我的开源仓库，看看最近在折腾什么。</p>
            <span class="destination" aria-hidden="true">github.com/oiuv<svg><use href="#new-window"/></svg></span>
          </div>
        </a>
        <a class="card game-card" href="https://gameivy.com" target="_blank" rel="noopener noreferrer" aria-labelledby="game-title" aria-describedby="game-desc new-tab-hint">
          <div class="cover"><img src="./assets/gameivy.webp" width="848" height="339" alt=""></div>
          <div class="card-body">
            <h3 id="game-title"><svg aria-hidden="true"><use href="#gamepad"/></svg>游戏常春藤</h3>
            <p id="game-desc">从魔兽世界到魔力宝贝，和老朋友重温经典。</p>
            <span class="destination" aria-hidden="true">gameivy.com<svg><use href="#new-window"/></svg></span>
          </div>
        </a>
        <a class="card mud-card" href="https://mud.ren" target="_blank" rel="noopener noreferrer" aria-labelledby="mud-title" aria-describedby="mud-desc new-tab-hint">
          <div class="cover"><img src="./assets/mud.webp" width="848" height="339" alt=""></div>
          <div class="card-body">
            <h3 id="mud-title"><svg aria-hidden="true"><use href="#terminal"/></svg>MUD.REN</h3>
            <p id="mud-desc">来玩 MUD 游戏，重回小说中的武侠江湖。</p>
            <span class="destination" aria-hidden="true">mud.ren<svg><use href="#new-window"/></svg></span>
          </div>
        </a>
      </div>
    </nav>
  </main>
  <footer class="wrap footer">
    <span>© oiuv<span aria-hidden="true">.</span></span>
    <a class="filing" href="https://beian.miit.gov.cn/">京ICP备13031296号-2</a>
    <span class="footer-art" aria-hidden="true"><i></i><i></i><i></i></span>
  </footer>
  <script>
    const motionButton = document.getElementById('motion');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    function setMotion(enabled) {
      document.documentElement.dataset.motion = enabled ? 'on' : 'off';
      motionButton.setAttribute('aria-pressed', String(enabled));
      motionButton.title = enabled ? '暂停场景动效' : '开启场景动效';
      motionButton.querySelector('use').setAttribute('href', enabled ? '#pause' : '#play');
    }
    setMotion(!reducedMotion.matches);
    motionButton.hidden = false;
    motionButton.addEventListener('click', () => setMotion(motionButton.getAttribute('aria-pressed') === 'false'));
    reducedMotion.addEventListener('change', event => setMotion(!event.matches));
  </script>
</body>
</html>
